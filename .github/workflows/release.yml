name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          echo "mod_version=$(prop mod_version)" >> "$GITHUB_OUTPUT"

      - name: Check tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.versions.outputs.mod_version }}"

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - run: gradle build --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TAG: v${{ steps.versions.outputs.mod_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ver="${{ steps.versions.outputs.mod_version }}"
          mkdir -p release-split/minecraft-1.21.1-fabric
          printf '%s\n' "serene seasons better winter for minecraft 1.21.1 fabric" > release-split/minecraft-1.21.1-fabric/title.txt
          cat > release-split/minecraft-1.21.1-fabric/body.md <<EOF
          Minecraft **1.21.1** / Fabric. Put the jar in the \`mods\` folder.

          Also install Serene Seasons Fabric 1.21.1, Fabric API and Fabric Language Kotlin. Deciduous leaves hide in late autumn and winter. License: GPL-3.0-only.
          EOF
          cp -v "build/libs/serenebetterwinter-fabric-1.21.1-${ver}.jar" release-split/minecraft-1.21.1-fabric/
          python3 .github/scripts/publish-split-releases.py release-split

      - name: Check Modrinth token
        id: modrinth_token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Replace Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/replace-modrinth-versions.py serene-seasons-better-winter-fabric "${{ steps.versions.outputs.mod_version }}"

      - name: Publish Modrinth
        if: steps.modrinth_token.outputs.present == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: serene-seasons-better-winter-fabric
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: Fabric 1.21.1. Deciduous leaves hide in late autumn and winter.
          loaders: fabric
          game-versions: "1.21.1"
          java: "21"
          files: build/libs/serenebetterwinter-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            serene-seasons(required){modrinth:e0bNACJD}
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}

      - name: Delete replaced Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/replace-modrinth-versions.py --finish release-assets/modrinth-delete-after-publish.txt

      - name: Update Modrinth description
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/update-modrinth-body.py serene-seasons-better-winter-fabric modrinth.md
